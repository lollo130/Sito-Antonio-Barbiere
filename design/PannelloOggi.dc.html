<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
  <style>
    body { margin: 0; background: #F6F2EA; }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    button { font-family: inherit; cursor: pointer; border: none; background: none; }
    a { color: #8A5A1E; }
    a:hover { color: #6E4715; }
    .lista::-webkit-scrollbar { width: 0; }
  </style>
</helmet>

<div style="width: 390px; height: 844px; display: flex; flex-direction: column; background: #F6F2EA; font-family: 'Atkinson Hyperlegible', 'Segoe UI', system-ui, sans-serif; color: #1C1917; overflow: hidden;">

  <!-- TESTATA -->
  <div style="padding: 14px 16px 12px; background: #1C1917; color: #FFFCF7;">
    <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px;">
      <div>
        <div style="font-family: 'DM Serif Display', 'Iowan Old Style', Georgia, serif; font-size: 25px; line-height: 1.1;">Oggi</div>
        <div style="font-size: 15px; color: #C09A5E;">{{dataOggi}}</div>
      </div>
      <button style="display: flex; align-items: center; justify-content: center; width: 46px; height: 46px; border-radius: 12px; border: 1.5px solid #55504B; color: #FFFCF7;">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
    </div>

    <div style="display: flex; align-items: center; gap: 8px;">
      <button style="display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; border-radius: 11px; border: 1.5px solid #55504B; color: #FFFCF7;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <button style="flex-grow: 1; min-height: 44px; border-radius: 11px; background: #FFFCF7; color: #1C1917; font-size: 16px; font-weight: 700;">Oggi</button>
      <button style="display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; border-radius: 11px; border: 1.5px solid #55504B; color: #FFFCF7;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
      </button>
    </div>
  </div>

  <!-- FILTRO OPERATORE -->
  <div style="display: flex; gap: 7px; padding: 12px 16px; background: #FFFCF7; border-bottom: 1px solid #E4DCCE;">
    <sc-for list="{{filtri}}" as="f" hint-placeholder-count="4">
      <button onClick="{{f.scegli}}" style="flex-grow: 1; min-height: 44px; padding: 0 10px; border-radius: 11px; border: 2px solid {{f.bordo}}; background: {{f.sfondo}}; color: {{f.testo}}; font-size: 16px; font-weight: 700;">{{f.nome}}</button>
    </sc-for>
  </div>

  <!-- LISTA -->
  <div class="lista" style="flex: 1; overflow-y: auto; padding: 14px 16px 16px;">
    <div style="font-size: 15px; color: #57534E; margin-bottom: 10px;">{{conteggio}}</div>

    <div style="display: flex; flex-direction: column; gap: 9px;">
      <sc-for list="{{righe}}" as="r" hint-placeholder-count="5">
        <div style="padding: 13px 15px; border-radius: 14px; background: {{r.sfondo}}; border: 2px solid {{r.bordo}};">
          <div style="display: flex; align-items: baseline; gap: 11px; margin-bottom: 3px;">
            <span style="font-family: 'DM Serif Display', 'Iowan Old Style', Georgia, serif; font-size: 23px; color: {{r.testoOra}}; font-variant-numeric: tabular-nums;">{{r.ora}}</span>
            <span style="font-size: 19px; font-weight: 700; color: {{r.testoNome}};">{{r.cliente}}</span>
          </div>
          <div style="display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 11px;">
            <span style="font-size: 16px; color: #57534E;">{{r.servizio}}</span>
            <span style="width: 3px; height: 3px; border-radius: 999px; background: #A8A29E;"></span>
            <span style="font-size: 16px; color: #57534E;">{{r.operatore}}</span>
            <sc-if value="{{r.aMano}}" hint-placeholder-val="{{false}}">
              <span style="font-size: 13px; font-weight: 700; padding: 2px 8px; border-radius: 999px; background: #FBEFDC; color: #6E4715;">inserito a mano</span>
            </sc-if>
          </div>

          <div style="display: flex; align-items: center; gap: 7px;">
            <a href="#" style="display: flex; align-items: center; justify-content: center; gap: 6px; min-height: 44px; padding: 0 13px; border-radius: 11px; background: #2D4A3E; color: #FFFCF7; font-size: 15px; font-weight: 700; text-decoration: none;">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8.1 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2Z"/></svg>
              {{r.telefono}}
            </a>
            <button onClick="{{r.fatto}}" style="display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; border-radius: 11px; border: 2px solid {{r.bordoFatto}}; background: {{r.sfondoFatto}}; color: {{r.iconaFatto}};">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
            </button>
            <button style="display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; border-radius: 11px; border: 2px solid #E4DCCE; color: #57534E;">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
            </button>
          </div>
        </div>
      </sc-for>
    </div>
  </div>

  <!-- AZIONI RAPIDE -->
  <div style="display: flex; gap: 9px; padding: 12px 16px 18px; background: #FFFCF7; border-top: 1px solid #E4DCCE;">
    <button style="flex-grow: 1; display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 58px; border-radius: 13px; background: #1C1917; color: #FFFCF7; font-size: 17px; font-weight: 700;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      Aggiungi
    </button>
    <button style="flex-grow: 1; display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 58px; border-radius: 13px; border: 2px solid #1C1917; color: #1C1917; font-size: 17px; font-weight: 700;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="5" width="16" height="16" rx="3"/><path d="M8 3v4M16 3v4M9 14h6"/></svg>
      Blocca
    </button>
  </div>

</div>
</x-dc>

<script data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { filtro: 'tutti', fatti: {} };
  }

  renderVals() {
    const st = this.state;

    const appuntamenti = [
      { id: 'a1', ora: '09:00', cliente: 'Concetta R.', servizio: 'Piega', operatore: 'Rosa', telefono: '347 000 0001', aMano: false },
      { id: 'a2', ora: '09:30', cliente: 'Giuseppe M.', servizio: 'Taglio e barba', operatore: 'Salvo', telefono: '340 000 0002', aMano: false },
      { id: 'a3', ora: '10:00', cliente: 'Sebastiano C.', servizio: 'Taglio uomo', operatore: 'Nunzio', telefono: '333 000 0003', aMano: false },
      { id: 'a4', ora: '10:00', cliente: 'Turi (zio)', servizio: 'Barba', operatore: 'Salvo', telefono: '349 000 0004', aMano: true },
      { id: 'a5', ora: '11:00', cliente: 'Alfio P.', servizio: 'Taglio bambino', operatore: 'Nunzio', telefono: '328 000 0005', aMano: false },
      { id: 'a6', ora: '16:30', cliente: 'Maria G.', servizio: 'Colore', operatore: 'Rosa', telefono: '331 000 0006', aMano: false },
      { id: 'a7', ora: '17:30', cliente: 'Salvatore L.', servizio: 'Taglio uomo', operatore: 'Salvo', telefono: '338 000 0007', aMano: false },
    ];

    const filtri = [
      { id: 'tutti', nome: 'Tutti' },
      { id: 'Salvo', nome: 'Salvo' },
      { id: 'Nunzio', nome: 'Nunzio' },
      { id: 'Rosa', nome: 'Rosa' },
    ].map((f) => ({
      nome: f.nome,
      bordo: st.filtro === f.id ? '#1C1917' : '#E4DCCE',
      sfondo: st.filtro === f.id ? '#1C1917' : '#FFFCF7',
      testo: st.filtro === f.id ? '#FFFCF7' : '#57534E',
      scegli: () => this.setState({ filtro: f.id }),
    }));

    const visibili = appuntamenti.filter((a) => st.filtro === 'tutti' || a.operatore === st.filtro);

    const righe = visibili.map((a) => {
      const fatto = !!st.fatti[a.id];
      return {
        ora: a.ora,
        cliente: a.cliente,
        servizio: a.servizio,
        operatore: a.operatore,
        telefono: a.telefono,
        aMano: a.aMano,
        sfondo: fatto ? '#EFEBE2' : '#FFFCF7',
        bordo: fatto ? '#E4DCCE' : '#E4DCCE',
        testoOra: fatto ? '#A8A29E' : '#8A5A1E',
        testoNome: fatto ? '#A8A29E' : '#1C1917',
        bordoFatto: fatto ? '#2D4A3E' : '#E4DCCE',
        sfondoFatto: fatto ? '#2D4A3E' : '#FFFCF7',
        iconaFatto: fatto ? '#FFFCF7' : '#57534E',
        fatto: () => {
          const agg = Object.assign({}, this.state.fatti);
          agg[a.id] = !agg[a.id];
          this.setState({ fatti: agg });
        },
      };
    });

    const restanti = visibili.filter((a) => !st.fatti[a.id]).length;

    return {
      dataOggi: 'giovedì 10 settembre',
      filtri,
      righe,
      conteggio: visibili.length + ' appuntamenti · ' + restanti + ' da fare',
    };
  }
}
</script>
</body>
</html>
