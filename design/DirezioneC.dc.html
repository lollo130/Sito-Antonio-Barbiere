<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap">
  <style>
    body { margin: 0; background: #FFFFFF; }
    * { box-sizing: border-box; }
    button { font-family: inherit; cursor: pointer; border: none; background: none; }
    a { color: #111111; }
    a:hover { color: #444444; }
  </style>
</helmet>

<div style="width: 390px; height: 844px; overflow: hidden; background: #FFFFFF; font-family: 'Atkinson Hyperlegible', 'Segoe UI', system-ui, sans-serif; color: #111111;">

  <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 16px 18px; border-bottom: 3px solid #111111;">
    <div style="font-size: 21px; font-weight: 700; line-height: 1.1;">Antonio<span style="font-weight: 400; color: #555555;"> · Solarino</span></div>
  </div>

  <div style="padding: 28px 18px 0;">
    <h1 style="font-size: 42px; font-weight: 700; line-height: 1.1; margin: 0 0 18px; letter-spacing: -0.02em;">Prenota il tuo taglio</h1>
    <p style="font-size: 20px; line-height: 1.45; color: #333333; margin: 0 0 26px;">Scegli il servizio, poi il giorno. Ci vuole un minuto e non serve registrarsi.</p>

    <button style="display: flex; align-items: center; justify-content: center; width: 100%; min-height: 76px; background: #111111; color: #FFFFFF; font-size: 24px; font-weight: 700;">
      Prenota
    </button>

    <button style="display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; min-height: 76px; margin-top: 12px; border: 3px solid #111111; color: #111111; font-size: 24px; font-weight: 700;">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8.1 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2Z"/></svg>
      Chiama
    </button>
  </div>

  <div style="margin-top: 32px; padding: 20px 18px; background: #111111; color: #FFFFFF;">
    <div style="font-size: 20px; font-weight: 700; line-height: 1.35;">Aperto oggi fino alle 19:30</div>
    <div style="font-size: 18px; color: #BBBBBB;">Chiuso domenica e lunedì</div>
  </div>

  <div style="padding: 22px 18px 0;">
    <div style="display: flex; flex-direction: column;">
      <sc-for list="{{servizi}}" as="s" hint-placeholder-count="4">
        <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 16px 0; border-bottom: 1px solid #DDDDDD;">
          <span style="font-size: 20px; font-weight: 700;">{{s.nome}}</span>
          <span style="font-size: 20px; font-weight: 700; white-space: nowrap;">{{s.prezzo}}</span>
        </div>
      </sc-for>
    </div>
  </div>

</div>
</x-dc>

<script data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      servizi: [
        { nome: 'Taglio uomo', prezzo: '15,00 €' },
        { nome: 'Taglio e barba', prezzo: '22,00 €' },
        { nome: 'Barba', prezzo: '10,00 €' },
      ],
    };
  }
}
</script>
</body>
</html>
