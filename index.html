<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <link rel="manifest" href="/manifest.json" id="manifesto" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#2e5949" />
    <meta
      name="description"
      content="Barbiere a Solarino (SR). Taglio, barba e cura della persona. Prenoti online in un minuto, senza registrarti."
    />
    <title>Antonio — Barbiere a Solarino</title>

    <!--
      iPhone: Safari ignora manifest.json quando si aggiunge alla schermata
      Home. Senza queste righe l'icona diventa uno screenshot della pagina e
      il nome sotto l'icona è il titolo intero, troncato. Sono l'unico modo
      di controllare come appare l'app su iOS.
    -->
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" id="icona-ios" />
    <meta name="apple-mobile-web-app-title" content="Antonio" id="nome-ios" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <!--
      Due app, non una.

      Sotto /admin questa stessa pagina si presenta come un'app diversa:
      "Agenda", icona cuoio col calendario, che si apre direttamente
      sull'agenda del titolare. I clienti installano "Antonio" dalla home e
      si ritrovano il salone; il titolare installa "Agenda" da /admin e si
      ritrova il suo lavoro, senza passare dal sito e senza scrivere
      indirizzi. Sullo stesso telefono possono stare tutte e due.

      Lo scambio va fatto QUI, mentre la pagina si legge, non da React:
      Chrome decide che app stai installando guardando il manifest presente
      al momento, e iPhone guarda apple-touch-icon e il titolo quando si
      tocca "Aggiungi a schermata Home". Se aspettassimo il primo render,
      chi apre /admin da un collegamento diretto si installerebbe l'app dei
      clienti. React aggiorna comunque questi stessi tag quando si cambia
      pagina senza ricaricare (src/lib/installazione.ts).
    -->
    <script>
      (function () {
        if (location.pathname.indexOf('/admin') !== 0) return;
        document.getElementById('manifesto').href = '/manifest-agenda.json';
        document.getElementById('icona-ios').href = '/icons/agenda-apple-touch.png';
        document.getElementById('nome-ios').content = 'Agenda';
        var tema = document.querySelector('meta[name="theme-color"]');
        if (tema) tema.content = '#1f3e33';
      })();
    </script>

    <!--
      Rete di sicurezza contro la pagina bianca.
      Se il bundle va in errore mentre si carica (caso tipico: variabili
      d'ambiente mancanti sul server di pubblicazione), React non monta mai e
      l'utente vede una pagina vuota, senza nessuna indicazione. Questo script
      sta nell'HTML, quindi gira anche quando il modulo dell'app non parte.
    -->
    <script>
      (function () {
        var mostrato = false;

        function guasto(dettaglio) {
          if (mostrato) return;
          var radice = document.getElementById('root');
          if (!radice || radice.hasChildNodes()) return;
          mostrato = true;

          var testo = String(dettaglio || 'errore sconosciuto')
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;');

          radice.innerHTML =
            '<div style="min-height:100svh;display:flex;align-items:center;justify-content:center;padding:24px;' +
            'background:#f6f2ea;color:#1c1917;font-family:\'Atkinson Hyperlegible\',\'Segoe UI\',system-ui,sans-serif">' +
            '<div style="max-width:34rem;background:#fffcf7;border:2px solid #1c1917;border-radius:16px;padding:28px">' +
            '<p style="margin:0 0 12px;font-size:1.4rem;font-weight:700">Il sito non è riuscito ad avviarsi</p>' +
            '<p style="margin:0 0 18px;font-size:1rem;line-height:1.6;color:#57534e">' +
            'Se stai vedendo questo messaggio, chiama pure il salone: la prenotazione si può sempre fare per telefono.' +
            '</p>' +
            '<p style="margin:0;font-size:0.8rem;line-height:1.6;color:#57534e">Dettaglio tecnico: ' +
            '<code style="font-family:Consolas,monospace">' + testo + '</code></p>' +
            '</div></div>';
        }

        window.addEventListener('error', function (e) {
          guasto((e && (e.message || (e.error && e.error.message))) || null);
        });
        window.addEventListener('unhandledrejection', function (e) {
          guasto((e && e.reason && (e.reason.message || e.reason)) || null);
        });
        window.addEventListener('load', function () {
          setTimeout(function () {
            guasto('l\'applicazione non si è avviata entro il tempo previsto');
          }, 3000);
        });
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
